  vscode-languageserver-textdocument: ^1.0.15
  "@astrojs/check": ^0.9.10
  "@types/pacote": ^11.1.8
  tar: ^7.5.22
  "@clack/prompts": ^1.8.1
  "@npmcli/config": ^11.2.0
  chalk: ^6.0.1
  commander: ^15.0.0
  diff: ^9.0.0
  node-diff3: ^3.2.1
  pacote: ^22.0.0
  bumpp: ^12.3.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
