  "@astrojs/rss": ^4.0.19
  "@lucide/astro": ^1.59.0
  astro: ^7.4.0
  astro-pagefind: ^2.0.1
  monaco-editor: ^0.57.0
  "@html-eslint/eslint-plugin": ^0.67.0
  "@html-eslint/parser": ^0.67.0
  "@types/node": ^26.6.5
  "@types/vscode": 1.100.0
  "@vitest/browser-playwright": 5.0.5
  "@vscode/test-cli": ^0.0.15
  "@vscode/test-electron": ^3.1.0
  "@vscode/vsce": ^4.0.0
  embla-carousel: ^8.6.0
  embla-carousel-auto-scroll: ^8.6.0
  embla-carousel-autoplay: ^8.6.0
  embla-carousel-class-names: ^8.6.0
  emmet: ^2.4.11
  eslint: ^10.13.0
  happy-dom: ^21.0.3
  jiti: ^2.7.0
  playwright: 1.64.1
  signal-polyfill: 0.2.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  vscode-jsonrpc: ^9.0.3
  vscode-languageclient: ^10.1.2
