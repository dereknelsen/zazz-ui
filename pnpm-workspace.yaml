packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@astrojs/markdoc": ^2.1.0
  "@astrojs/rss": ^4.0.19
  "@astrojs/sitemap": ^3.7.4
  astro: ^7.4.0
  astro-pagefind: ^2.0.1
  "@codemirror/state": ^6.7.6
  "@codemirror/view": ^6.43.15
  "@codemirror/commands": ^6.11.1
  "@codemirror/language": ^6.13.1
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/lint": ^6.9.7
  "@codemirror/autocomplete": ^6.20.4
  "@codemirror/search": ^6.7.2
  "@lezer/highlight": ^1.2.5
  "@html-eslint/eslint-plugin": ^0.67.0
  "@html-eslint/parser": ^0.67.0
  "@types/node": ^26.6.5
  "@types/vscode": 1.100.0
  "@vitest/browser-playwright": 5.1.0
  "@vscode/test-cli": ^0.0.15
  "@vscode/test-electron": ^3.1.0
  "@vscode/vsce": ^4.0.0
  emmet: ^2.4.11
  eslint: ^10.14.0
  happy-dom: ^21.0.3
  jiti: ^2.7.0
  playwright: 1.64.1
  signal-polyfill: 0.2.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vscode-jsonrpc: ^9.0.3
  vscode-languageclient: ^10.1.2
  vscode-languageserver: ^10.1.2
  vscode-languageserver-textdocument: ^1.0.15
  "@astrojs/check": ^0.9.10
  "@types/pacote": ^11.1.8
  tar: ^7.5.22
  "@clack/prompts": ^1.8.1
  "@npmcli/config": ^11.2.0
  chalk: ^6.0.1
  commander: ^15.0.0
  diff: ^9.0.0
  node-diff3: ^3.2.1
  pacote: ^22.0.0
  bumpp: ^12.3.0
  vitest: 5.1.0
  "@awesome.me/kit-73088f7c71": ^1.0.2
  "@lucide/astro": ^1.76.0
  lucide-static: ^1.76.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
# astro2tsx (under @astrojs/check) is WASM-only and pins @emnapi/core 1.x, but leaves
# @napi-rs/wasm-runtime's @emnapi/runtime peer to resolution, which picks the 2.0 beta that
# rolldown's WASM fallback brings in. The 1.x core and 2.0 runtime don't share a bridge API
# (`this.bridge.deleteEnv is not a function`), so `astro check` crashed on load. Give it the
# runtime that matches its core.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.57"
  - ai@7.0.71
  - "@astrojs/internal-helpers@0.12.0"
  - "@astrojs/markdoc@2.0.10"
  - "@astrojs/markdown-satteri@0.4.3"
  - astro@7.3.6
  - "@voidzero-dev/vite-plus-core@8.3.8000"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.7.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.7.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.7.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.7.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.7.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.7.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.7.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.7.0"
  - vite-plus@1.7.0
  - "@awesome.me/kit-73088f7c71@1.0.2"
