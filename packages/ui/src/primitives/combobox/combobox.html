<div class="ui-field max-w-xl">
  <label data-slot="field-label" for="cb-country">Country</label>
  <ui-combobox>
    <input type="hidden" name="country" data-slot="combobox-value" value="" />
    <div data-slot="combobox-control">
      <input
        id="cb-country"
        type="text"
        placeholder="Select a country..."
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        autocomplete="off"
      />
      <button
        type="button"
        data-slot="combobox-trigger"
        tabindex="-1"
        aria-label="Show options"
      ></button>
    </div>
    <div data-slot="combobox-panel" data-side="bottom" data-align="start" popover="manual">
      <ul role="listbox" data-slot="combobox-list" aria-label="Countries">
        <li
          role="option"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="au"
        >
          Australia
        </li>
        <li
          role="option"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="ca"
        >
          Canada
        </li>
        <li
          role="option"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="jp"
        >
          Japan
        </li>
        <li
          role="option"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="nz"
        >
          New Zealand
        </li>
        <li
          role="option"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="us"
        >
          United States
        </li>
      </ul>
      <p data-slot="combobox-empty" class="text-muted-foreground text-sm">No matches.</p>
    </div>
  </ui-combobox>
</div>
