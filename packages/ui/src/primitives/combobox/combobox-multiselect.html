<div class="ui-field max-w-xl">
  <label data-slot="field-label" for="cb-tags">Tags</label>
  <ui-combobox data-variant="multiselect" data-label-remove="Remove {label}">
    <!-- Pre-selected rows carry aria-selected="true"; the authored input holds
         the first value and combobox.js stamps a same-name sibling per extra -->
    <input type="hidden" name="tags" data-slot="combobox-value" value="design" />
    <div data-slot="combobox-control">
      <!-- Optional: the tag blueprint, cloned per selection. Omit it and the
           kit's default applies; keep it to restyle tags in HTML -->
      <template data-slot="combobox-tag-template">
        <span class="ui-badge" data-slot="combobox-tag">
          <span data-slot="combobox-tag-label"></span>
          <button type="button" tabindex="-1" data-slot="combobox-tag-remove"></button>
        </span>
      </template>

      <input
        id="cb-tags"
        type="text"
        placeholder="Add tags..."
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        autocomplete="off"
        hidden
        aria-hidden="true"
      />
      <button
        type="button"
        data-slot="combobox-trigger"
        tabindex="-1"
        aria-label="Show options"
      ></button>
    </div>
    <div data-slot="combobox-panel" data-side="bottom" data-align="start" popover="manual">
      <ul role="listbox" aria-multiselectable="true" data-slot="combobox-list" aria-label="Tags">
        <li
          role="option"
          aria-selected="true"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="design"
        >
          Design
        </li>
        <li
          role="option"
          aria-selected="true"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="engineering"
        >
          Engineering
        </li>
        <li
          role="option"
          aria-selected="false"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="marketing"
        >
          Marketing
        </li>
        <li
          role="option"
          aria-selected="false"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="research"
        >
          Research
        </li>
        <li
          role="option"
          aria-selected="false"
          data-slot="combobox-item"
          class="ui-button justify-start"
          data-variant="ghost"
          data-value="support"
        >
          Support
        </li>
      </ul>
      <p data-slot="combobox-empty" class="text-muted-foreground text-sm">No matches.</p>
    </div>
  </ui-combobox>
</div>
