<fieldset class="ui-field-group">
  <legend>Notifications</legend>
  <div class="flex flex-col gap-xs">
    <label class="ui-field" data-orientation="horizontal">
      <input type="checkbox" role="switch" name="notifications-email" />
      <span data-slot="field-label">Email notifications</span>
    </label>
    <label class="ui-field" data-orientation="horizontal">
      <input type="checkbox" role="switch" name="notifications-2fa" checked />
      <span data-slot="field-label">Two-factor authentication</span>
    </label>
  </div>
</fieldset>
