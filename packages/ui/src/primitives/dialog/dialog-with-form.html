<button class="ui-button" type="button" command="show-modal" commandfor="form-dialog-1">
  New project
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <rect width="256" height="256" fill="none" />
    <line
      x1="40"
      y1="128"
      x2="216"
      y2="128"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="16"
    />
    <line
      x1="128"
      y1="40"
      x2="128"
      y2="216"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="16"
    />
  </svg>
</button>
<dialog id="form-dialog-1" class="ui-dialog" closedby="any" data-size="article">
  <div data-slot="dialog-content">
    <header data-slot="dialog-header">
      <h2 class="text-lg font-heading font-strong">New project</h2>
      <p class="text-muted-foreground">
        Add a project to your workspace. You can change these settings later.
      </p>
    </header>
    <form id="f-new-project-1" class="flex flex-col gap-md" data-slot="dialog-body" method="dialog">
      <fieldset class="ui-field-group">
        <legend class="sr-only">Contact</legend>
        <div class="grid grid-cols-2 gap-sm">
          <div class="ui-field">
            <label data-slot="field-label" for="fd-name">Name</label>
            <input
              class="ui-input"
              id="fd-name"
              name="name"
              type="text"
              inputmode="text"
              placeholder="Ada Lovelace"
              required
            />
          </div>
          <div class="ui-field">
            <label data-slot="field-label" for="fd-email">Email</label>
            <input
              class="ui-input"
              id="fd-email"
              name="email"
              type="email"
              inputmode="email"
              required
              placeholder="you@example.com"
              autocomplete="email"
              aria-describedby="fd-email-hint"
            />
            <div data-slot="field-description">
              <span data-slot="field-hint" id="fd-email-hint"
                >We'll only use this to send receipts.</span
              >
              <span data-slot="field-error" role="alert">Please enter a valid email address.</span>
            </div>
          </div>
          <label class="ui-field-group col-span-2">
            <span data-slot="field-label">Repository</span>
            <div class="ui-input-group">
              <input
                class="ui-input"
                type="search"
                name="repo"
                id="fd-repo"
                inputmode="search"
                placeholder="Search repositories…"
              />
              <span data-slot="input-group-addon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                  <rect width="256" height="256" fill="none" />
                  <circle
                    cx="112"
                    cy="112"
                    r="80"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  />
                  <line
                    x1="168.57"
                    y1="168.57"
                    x2="224"
                    y2="224"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  />
                </svg>
              </span>
            </div>
          </label>
        </div>
      </fieldset>

      <fieldset class="ui-field-group">
        <div class="ui-field">
          <label data-slot="field-label" for="fd-message">Description</label>
          <textarea
            class="ui-textarea"
            id="fd-message"
            name="description"
            inputmode="text"
            placeholder="What is this project for?"
          ></textarea>
        </div>
      </fieldset>

      <fieldset class="ui-radio-group">
        <legend>Billing</legend>
        <label class="ui-field" data-orientation="horizontal">
          <input class="ui-radio" type="radio" name="billing" value="monthly" />
          <span data-slot="field-label">Monthly billing</span>
        </label>
        <label class="ui-field" data-orientation="horizontal">
          <input class="ui-radio" type="radio" name="billing" value="annual" checked />
          <span data-slot="field-label">Annual billing</span>
        </label>
      </fieldset>

      <label class="ui-field" data-orientation="horizontal">
        <input type="checkbox" name="terms" required />
        <span data-slot="field-label">Accept terms &amp; conditions</span>
      </label>
    </form>
    <footer data-slot="dialog-footer">
      <button
        class="ui-button"
        type="button"
        value="cancel"
        commandfor="form-dialog-1"
        command="close"
      >
        Cancel
      </button>
      <button
        class="ui-button"
        data-variant="primary"
        type="submit"
        form="f-new-project-1"
        value="save"
      >
        Create project
      </button>
    </footer>
    <button
      class="ui-button"
      data-slot="dialog-close"
      data-size="icon"
      data-variant="ghost"
      type="button"
      commandfor="form-dialog-1"
      command="close"
      aria-label="Close dialog"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
        <rect width="256" height="256" fill="none" />
        <line
          x1="200"
          y1="56"
          x2="56"
          y2="200"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="16"
        />
        <line
          x1="200"
          y1="200"
          x2="56"
          y2="56"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="16"
        />
      </svg>
    </button>
  </div>
</dialog>
