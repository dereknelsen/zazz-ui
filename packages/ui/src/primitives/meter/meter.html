<div class="flex flex-col gap-sm" style="inline-size: min(100%, 24rem)">
  <div class="ui-field">
    <label class="flex items-center justify-between" data-slot="field-label" for="f-storage">
      <span>Storage used</span>
      <span class="text-xs text-muted-foreground">52/100 GB</span>
    </label>
    <meter
      class="ui-meter"
      id="f-storage"
      min="0"
      max="100"
      low="60"
      high="85"
      optimum="30"
      value="52"
    >
      52 GB of 100 GB
    </meter>
  </div>
  <div class="ui-field">
    <label class="flex items-center justify-between" data-slot="field-label" for="f-storage-high">
      <span>Nearly full</span>
      <span class="text-xs text-muted-foreground">93/100 GB</span>
    </label>
    <meter
      class="ui-meter"
      id="f-storage-high"
      min="0"
      max="100"
      low="60"
      high="85"
      optimum="30"
      value="93"
    >
      93 GB of 100 GB
    </meter>
  </div>
</div>
