# THE ZAZZ KITCHEN SINK | Human Commentary

## Purpose
Welcome to the Zazz Kitchen Sink. I've written this and other inline comments by hand to 
ensure that I am providing developers and LLMs a comprehensive set of recommended best 
practices for using Zazz primitives in various semantic contexts.

## Who is Zazz for?
Zazz is the result of many years of working with multiple cutting-edge frameworks, build 
tools, and design systems as well as decades-old legacy systems. Zazz specifically answers
two questions:

1. "How can I update a massive legacy system without rewriting it from scratch?"
2. "How can I build a modern web application without a build step?"


================================================================================= -->

    <!-- Zazz behavior: one ES module imports every component script in dependency order -->
    <script type="module" src="../src/index.js"></script>
    <!-- Theme: apply the persisted (or preferred) scheme before first paint -->
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("theme");
          const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = storedTheme ?? (prefersDark ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch {
          document.documentElement.classList.toggle(
            "dark",
            matchMedia("(prefers-color-scheme: dark)").matches,
          );
        }
      })();
    </script>
