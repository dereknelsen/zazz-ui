<a
  href="#"
  style="
    --display: grid;
    --cursor: pointer;
  "
>
  <div data-ui="card">
    <figure
      style="
        --display: grid;
        --aspect: 3 / 2;
        --rounded: var(--radius-md) var(--radius-md) 0 0;
        --overflow: clip;
      "
    >
      <img
        width="300"
        height="200"
        loading="lazy"
        src="https://images.unsplash.com/photo-1564760055775-d63b17a55c44?auto=format&fit=crop&w=300&h=200&q=60"
        alt="Elephants crossing a dusty riverbed"
        style="
          --size: 100%;
          --opacity: 1;
          --opacity--hover: 0.75;
          --scale: 1;
          --scale--hover: 1.02;
          --transition: var(--default-transition);
          --object-fit: cover;
        "
      />
    </figure>
    <div
      style="
        --display: grid;
        --px: 4;
        --pb: 4;
        --gap: 4;
      "
    >
      <header
        style="
          --display: grid;
          --gap: 2;
        "
      >
        <div
          style="
            --display: flex;
            --items: center;
            --gap: 2;
          "
        >
          <span data-ui="badge" data-badge-variant="muted">Research</span>
        </div>
        <hgroup
          style="
            --display: grid;
            --gap: 2;
          "
        >
          <h3
            style="
              --font-size: var(--font-size-lg);
              --font-family: var(--font-family-heading);
              --leading: var(--leading-lg);
              --tracking: var(--tracking-lg);
            "
          >
            Migration patterns
          </h3>
          <p
            style="
              --font-size: var(--font-size-sm);
              --leading: var(--leading-sm);
              --tracking: var(--tracking-sm);
              --line-clamp: 2;
              --text: var(--color-muted-foreground);
            "
          >
            Satellite collars reveal ancient routes herds still follow each dry season across the
            floodplain.
          </p>
        </hgroup>
      </header>
      <footer
        style="
          --display: grid;
          --justify: start;
          --pt: 4;
          --gap: 4;
          --border-t: 1;
        "
      >
        <div
          style="
            --display: flex;
            --items: center;
            --gap: 2;
          "
        >
          <figure
            data-ui="pile"
            role="img"
            style="
              --display: grid;
              --size: 11;
              --border-color: var(--color-border);
              --border-width: 1px;
              --rounded: var(--radius-full);
              --overflow: clip;
            "
          >
            <img
              width="64"
              height="64"
              loading="lazy"
              src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=facearea&facepad=2&w=64&h=64&q=90"
              alt="John Doe"
              aria-hidden="true"
              style="
                --order: 9999;
                --size: 100%;
                --bg: transparent;
                --object-fit: cover;
              "
            />
            <figcaption
              style="
                --display: flex;
                --items: center;
                --justify: center;
                --order: -9999;
                --size: 100%;
                --font-size: var(--font-size-md);
                --font-weight: strong;
                --leading: var(--leading-md);
                --tracking: var(--tracking-md);
                --text-align: center;
                --text: var(--color-primary-foreground);
                --bg: var(--color-primary);
              "
            >
              <span data-ui="sr-only">John Doe</span>
              <span aria-hidden="true">JD</span>
            </figcaption>
          </figure>
          <div style="--display: flex-col">
            <span
              style="
                --font-size: var(--font-size-sm);
                --font-weight: strong;
                --leading: var(--leading-sm);
                --leading: 1;
                --tracking: var(--tracking-sm);
              "
              >John Doe</span
            >
            <span
              style="
                --font-size: var(--font-size-xs);
                --leading: var(--leading-xs);
                --tracking: var(--tracking-xs);
                --text: var(--color-muted-foreground);
              "
              >Founder, ACME Inc.</span
            >
          </div>
        </div>
      </footer>
    </div>
  </div>
</a>
