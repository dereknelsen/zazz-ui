<form data-ui="field" style="--max-w: max-content">
  <label data-field-slot="label" for="f-otp">Verification code</label>
  <ui-otp data-otp-groups="3-3">
    <input
      data-ui="input"
      data-otp-slot="input"
      id="f-otp"
      name="otp"
      type="text"
      autocomplete="one-time-code"
      inputmode="numeric"
      pattern="\d{6}"
      maxlength="6"
      required
      spellcheck="false"
      autocapitalize="off"
    />
  </ui-otp>
  <div data-field-slot="description">
    <span data-field-slot="hint">Enter the 6-digit code we sent you.</span>
    <span data-field-slot="error">Enter all 6 digits.</span>
  </div>
</form>
