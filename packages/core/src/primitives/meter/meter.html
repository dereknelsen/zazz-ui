<div
  style="
    --display: flex-col;
    --gap: 4;
    --w: 100%;
    --max-w: 96;
  "
>
  <div data-ui="field">
    <label
      style="
        --display: flex;
        --items: center;
        --justify: space-between;
      "
      data-field-slot="label"
      for="f-storage"
    >
      <span>Storage used</span>
      <span
        style="
          --font-size: var(--font-size-xs);
          --text: var(--color-muted-foreground);
        "
        >52/100 GB</span
      >
    </label>
    <meter
      data-ui="meter"
      id="f-storage"
      min="0"
      max="100"
      low="60"
      high="85"
      optimum="30"
      value="52"
    >
      52 GB of 100 GB
    </meter>
  </div>
  <div data-ui="field">
    <label
      style="
        --display: flex;
        --items: center;
        --justify: space-between;
      "
      data-field-slot="label"
      for="f-storage-high"
    >
      <span>Nearly full</span>
      <span
        style="
          --font-size: var(--font-size-xs);
          --text: var(--color-muted-foreground);
        "
        >93/100 GB</span
      >
    </label>
    <meter
      data-ui="meter"
      id="f-storage-high"
      min="0"
      max="100"
      low="60"
      high="85"
      optimum="30"
      value="93"
    >
      93 GB of 100 GB
    </meter>
  </div>
</div>
