<fieldset data-ui="field-group">
  <legend>Preferences</legend>
  <div
    style="
      --display: flex-col;
      --gap: var(--space-xs);
    "
  >
    <label data-ui="field" data-field-orientation="horizontal">
      <input type="checkbox" data-checkbox-controls="preferences" />
      <span data-field-slot="label">Select all</span>
    </label>
    <label data-ui="field" data-field-orientation="horizontal">
      <input type="checkbox" name="preferences" value="newsletter" />
      <span data-field-slot="label">Subscribe to the newsletter</span>
    </label>
    <label data-ui="field" data-field-orientation="horizontal">
      <input type="checkbox" name="preferences" value="terms" checked />
      <span data-field-slot="label">Accept terms &amp; conditions</span>
    </label>
  </div>
</fieldset>
