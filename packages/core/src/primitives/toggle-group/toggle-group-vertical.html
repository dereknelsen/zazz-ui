<ui-toggle-group data-toggle-group-orientation="vertical" role="group" aria-label="Map layer">
  <label data-ui="toggle">
    <input type="radio" name="layer" value="map" checked />
    <span>Map</span>
  </label>
  <label data-ui="toggle">
    <input type="radio" name="layer" value="satellite" />
    <span>Satellite</span>
  </label>
  <label data-ui="toggle">
    <input type="radio" name="layer" value="terrain" />
    <span>Terrain</span>
  </label>
</ui-toggle-group>
