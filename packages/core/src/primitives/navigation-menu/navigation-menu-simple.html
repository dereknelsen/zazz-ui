<!-- A mixed bar: plain links, one rich panel, a plain link-list as a ui-menu
     item, and a search input at the end. -->
<header
  data-ui="layout"
  style="
    --display: grid;
    --w: 100%;
  "
>
  <nav data-ui="navigation-menu" style="--w: 100%">
    <menu data-navigation-menu-slot="list" style="--w: 100%">
      <li data-navigation-menu-slot="item">
        <a href="#" data-ui="button" data-button-variant="ghost">Home</a>
      </li>

      <li data-navigation-menu-slot="item">
        <button
          data-ui="button"
          data-navigation-menu-slot="trigger"
          data-button-variant="ghost"
          type="button"
          popovertarget="nav-simple-1"
        >
          Products
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <rect width="256" height="256" fill="none" />
            <polyline
              points="208 96 128 176 48 96"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="16"
            />
          </svg>
        </button>
        <div
          id="nav-simple-1"
          data-navigation-menu-slot="popover"
          data-popover-align="start"
          popover="auto"
          data-navigation-menu-animation="slide-down"
        >
          <div data-navigation-menu-slot="viewport">
            <div
              style="
                --display: flex-col;
                --p: 2;
                --gap: 1px;
              "
            >
              <a href="#" data-navigation-menu-slot="link">
                <span
                  style="
                    --font-size: var(--font-size-sm);
                    --font-weight: strong;
                    --leading: var(--leading-sm);
                    --tracking: var(--tracking-sm);
                  "
                  >Editor</span
                >
                <span
                  style="
                    --font-size: var(--font-size-sm);
                    --leading: var(--leading-sm);
                    --tracking: var(--tracking-sm);
                    --text: var(--color-muted-foreground);
                  "
                  >Write and publish faster.</span
                >
              </a>
              <a href="#" data-navigation-menu-slot="link">
                <span
                  style="
                    --font-size: var(--font-size-sm);
                    --font-weight: strong;
                    --leading: var(--leading-sm);
                    --tracking: var(--tracking-sm);
                  "
                  >Library</span
                >
                <span
                  style="
                    --font-size: var(--font-size-sm);
                    --leading: var(--leading-sm);
                    --tracking: var(--tracking-sm);
                    --text: var(--color-muted-foreground);
                  "
                  >Everything in one place.</span
                >
              </a>
            </div>
          </div>
        </div>
      </li>
      <li data-navigation-menu-slot="item">
        <ui-menu>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            popovertarget="nav-simple-menu"
            interestfor="nav-simple-menu"
          >
            Company
          </button>
          <div
            id="nav-simple-menu"
            data-menu-slot="popover"
            data-popover-side="bottom"
            data-popover-align="start"
            popover="auto"
          >
            <menu>
              <li>
                <a href="#" data-ui="button" data-button-variant="ghost" style="--justify: start"
                  >About</a
                >
              </li>
              <li>
                <a href="#" data-ui="button" data-button-variant="ghost" style="--justify: start"
                  >Careers</a
                >
              </li>
              <li>
                <a href="#" data-ui="button" data-button-variant="ghost" style="--justify: start"
                  >Press</a
                >
              </li>
            </menu>
          </div>
        </ui-menu>
      </li>

      <li data-navigation-menu-slot="item" style="--ml: auto">
        <input
          data-ui="input"
          type="search"
          aria-label="Search the site"
          placeholder="Search…"
          style="--min-w: 40ch"
        />
      </li>
    </menu>
  </nav>
</header>
