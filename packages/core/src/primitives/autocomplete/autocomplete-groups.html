<div data-ui="field" style="--max-w: 96">
  <label data-field-slot="label" for="ac-produce">Produce</label>
  <ui-autocomplete data-autocomplete-sort="score">
    <input
      data-ui="input"
      id="ac-produce"
      name="produce"
      type="text"
      placeholder="Search produce..."
      role="combobox"
      aria-expanded="false"
      aria-autocomplete="list"
      autocomplete="off"
    />
    <div
      data-autocomplete-slot="panel"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="manual"
    >
      <ul role="listbox" data-autocomplete-slot="list" aria-label="Produce suggestions">
        <li role="group" data-autocomplete-slot="group" aria-labelledby="ac-group-fruit">
          <span
            data-autocomplete-slot="group-label"
            id="ac-group-fruit"
            style="
              --font-weight: var(--font-weight-strong);
              --display: inline-flex;
              --font-size: var(--font-size-eyebrow);
              --leading: var(--leading-eyebrow);
              --font-weight: var(--font-weight-eyebrow);
              --tracking: var(--tracking-eyebrow);
              --text-transform: uppercase;
              --text: var(--color-muted-foreground);
              --p: var(--space-xs);
            "
            >Fruit</span
          >
          <div
            role="option"
            data-autocomplete-slot="item"
            data-ui="button"
            data-button-variant="ghost"
            data-autocomplete-value="Apple"
            data-autocomplete-keywords="fruit red"
            style="--justify: start"
          >
            Apple
          </div>
          <div
            role="option"
            data-autocomplete-slot="item"
            data-ui="button"
            data-button-variant="ghost"
            data-autocomplete-value="Cherry"
            data-autocomplete-keywords="fruit red"
            style="--justify: start"
          >
            Cherry
          </div>
        </li>
        <li role="group" data-autocomplete-slot="group" aria-labelledby="ac-group-veg">
          <span
            data-autocomplete-slot="group-label"
            id="ac-group-veg"
            style="
              --font-weight: var(--font-weight-strong);
              --display: inline-flex;
              --font-size: var(--font-size-eyebrow);
              --leading: var(--leading-eyebrow);
              --font-weight: var(--font-weight-eyebrow);
              --tracking: var(--tracking-eyebrow);
              --text-transform: uppercase;
              --text: var(--color-muted-foreground);
              --p: var(--space-xs);
            "
            >Vegetables</span
          >
          <div
            role="option"
            data-autocomplete-slot="item"
            data-ui="button"
            data-button-variant="ghost"
            data-autocomplete-value="Carrot"
            data-autocomplete-keywords="vegetable orange"
            style="--justify: start"
          >
            Carrot
          </div>
          <div
            role="option"
            data-autocomplete-slot="item"
            data-ui="button"
            data-button-variant="ghost"
            data-autocomplete-value="Cauliflower"
            data-autocomplete-keywords="vegetable white"
            style="--justify: start"
          >
            Cauliflower
          </div>
        </li>
      </ul>
      <p data-autocomplete-slot="empty" style="--text: var(--color-muted-foreground)">
        No results.
      </p>
    </div>
  </ui-autocomplete>
</div>
