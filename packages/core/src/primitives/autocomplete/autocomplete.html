<div data-ui="field" style="--max-w: 96">
  <label data-field-slot="label" for="ac-fruit">Fruit</label>
  <ui-autocomplete>
    <input
      data-ui="input"
      id="ac-fruit"
      name="fruit"
      type="text"
      placeholder="Search fruits..."
      role="combobox"
      aria-expanded="false"
      aria-autocomplete="list"
      autocomplete="off"
    />
    <div
      data-autocomplete-slot="panel"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="manual"
    >
      <ul role="listbox" data-autocomplete-slot="list" aria-label="Fruit suggestions">
        <li
          role="option"
          data-autocomplete-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-autocomplete-value="Apple"
          style="--justify: start"
        >
          Apple
        </li>
        <li
          role="option"
          data-autocomplete-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-autocomplete-value="Banana"
          style="--justify: start"
        >
          Banana
        </li>
        <li
          role="option"
          data-autocomplete-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-autocomplete-value="Blueberry"
          style="--justify: start"
        >
          Blueberry
        </li>
        <li
          role="option"
          data-autocomplete-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-autocomplete-value="Cherry"
          style="--justify: start"
        >
          Cherry
        </li>
        <li
          role="option"
          data-autocomplete-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-autocomplete-value="Grape"
          style="--justify: start"
        >
          Grape
        </li>
      </ul>
      <p data-autocomplete-slot="empty" style="--text: var(--color-muted-foreground)">
        No results.
      </p>
    </div>
  </ui-autocomplete>
</div>
