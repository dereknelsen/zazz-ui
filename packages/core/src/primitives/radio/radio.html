<fieldset data-ui="radio-group">
  <legend>Options</legend>
  <div
    style="
      --display: flex;
      --flex-direction: column;
      --gap: var(--space-xs);
    "
  >
    <label data-ui="field" data-field-orientation="horizontal">
      <input data-ui="radio" type="radio" name="radio-options-example" value="option-1" />
      <span data-field-slot="label">Option 1</span>
    </label>
    <label data-ui="field" data-field-orientation="horizontal">
      <input data-ui="radio" type="radio" name="radio-options-example" value="option-2" checked />
      <span data-field-slot="label">Option 2</span>
    </label>
    <label data-ui="field" data-field-orientation="horizontal">
      <input data-ui="radio" type="radio" name="radio-options-example" value="option-3" />
      <span data-field-slot="label">Option 3</span>
    </label>
  </div>
</fieldset>
