<div data-ui="field" style="--max-w: 96">
  <label data-field-slot="label" for="cb-country">Country</label>
  <ui-combobox>
    <input type="hidden" name="country" data-combobox-slot="value" value="" />
    <div data-combobox-slot="control">
      <input
        id="cb-country"
        type="text"
        placeholder="Select a country..."
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        autocomplete="off"
      />
      <button
        type="button"
        data-combobox-slot="trigger"
        tabindex="-1"
        aria-label="Show options"
      ></button>
    </div>
    <div
      data-combobox-slot="panel"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="manual"
    >
      <ul role="listbox" data-combobox-slot="list" aria-label="Countries">
        <li
          role="option"
          data-combobox-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-combobox-value="au"
          style="--justify: start"
        >
          Australia
        </li>
        <li
          role="option"
          data-combobox-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-combobox-value="ca"
          style="--justify: start"
        >
          Canada
        </li>
        <li
          role="option"
          data-combobox-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-combobox-value="jp"
          style="--justify: start"
        >
          Japan
        </li>
        <li
          role="option"
          data-combobox-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-combobox-value="nz"
          style="--justify: start"
        >
          New Zealand
        </li>
        <li
          role="option"
          data-combobox-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          data-combobox-value="us"
          style="--justify: start"
        >
          United States
        </li>
      </ul>
      <p
        data-combobox-slot="empty"
        style="
          --text: var(--color-muted-foreground);
          --font-size: var(--font-size-sm);
          --leading: var(--leading-sm);
          --tracking: var(--tracking-sm);
        "
      >
        No matches.
      </p>
    </div>
  </ui-combobox>
</div>
