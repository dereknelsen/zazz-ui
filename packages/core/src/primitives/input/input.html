<div data-ui="field">
  <label data-field-slot="label" for="f-name">Name</label>
  <input
    data-ui="input"
    id="f-name"
    name="name"
    type="text"
    inputmode="text"
    placeholder="Ada Lovelace"
    autocomplete="name"
    autocapitalize="words"
    enterkeyhint="next"
  />
</div>
<div data-ui="field">
  <label data-field-slot="label" for="f-email">Email</label>
  <input
    data-ui="input"
    id="f-email"
    name="email"
    type="email"
    inputmode="email"
    required
    placeholder="you@example.com"
    autocomplete="email"
    autocapitalize="off"
    spellcheck="false"
    enterkeyhint="next"
    aria-describedby="f-email-hint"
  />
  <div data-field-slot="description">
    <span data-field-slot="hint" id="f-email-hint"
      >We'll never sell or share your email address.</span
    >
    <span data-field-slot="error" role="alert">Please enter a valid email address.</span>
  </div>
</div>
<div data-ui="field">
  <label data-field-slot="label" for="f-phone">Phone</label>
  <input
    data-ui="input"
    id="f-phone"
    name="phone"
    type="tel"
    inputmode="tel"
    placeholder="+1 (555) 012-3456"
    autocomplete="tel"
    enterkeyhint="next"
  />
</div>
<div data-ui="field">
  <label data-field-slot="label" for="f-date">Datetime</label>
  <input
    data-ui="input"
    id="f-date"
    name="date"
    type="datetime-local"
    inputmode="none"
    autocomplete="off"
  />
</div>
