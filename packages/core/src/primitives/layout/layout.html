<ui-layout style="--gap: 4">
  <ui-card style="--p: 4">Default band (xl)</ui-card>
  <ui-card
    style="
      --band: layout-md;
      --p: 4;
    "
  >
    --band: layout-md
  </ui-card>
  <ui-card
    style="
      --band: layout-bleed;
      --p: 4;
      --radius: 0;
    "
  >
    --band: layout-bleed
  </ui-card>
  <ui-card
    style="
      --band: layout-sm;
      --band--lg: layout-xl;
      --p: 4;
    "
  >
    --band: layout-sm, --band--lg: layout-xl
  </ui-card>
  <ui-layout data-layout-size="md" style="--band: layout-bleed">
    <ui-card style="--p: 4">nested layout, data-layout-size="md"</ui-card>
  </ui-layout>
</ui-layout>
