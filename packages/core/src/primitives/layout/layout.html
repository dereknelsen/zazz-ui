<ui-layout style="--gap: 4">
  <div data-ui="card" style="--p: 4">Default band (xl)</div>
  <div
    data-ui="card"
    style="
      --col: layout-md;
      --p: 4;
    "
  >
    --col: layout-md
  </div>
  <div
    data-ui="card"
    style="
      --col: layout-bleed;
      --p: 4;
      --rounded: 0;
    "
  >
    --col: layout-bleed
  </div>
  <div
    data-ui="card"
    style="
      --col: layout-sm;
      --col--lg: layout-xl;
      --p: 4;
    "
  >
    --col: layout-sm, --col--lg: layout-xl
  </div>
  <ui-layout data-layout-size="md" style="--col: layout-bleed">
    <div data-ui="card" style="--p: 4">nested layout, data-layout-size="md"</div>
  </ui-layout>
</ui-layout>
