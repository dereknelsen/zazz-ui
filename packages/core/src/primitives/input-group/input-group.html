<div data-ui="field">
  <label data-field-slot="label" for="f-search">Search</label>
  <label data-ui="input-group">
    <input
      data-ui="input"
      id="f-search"
      type="search"
      name="q"
      inputmode="search"
      placeholder="Search…"
      autocomplete="off"
      spellcheck="false"
      enterkeyhint="search"
      aria-describedby="f-search-hint"
    />
    <span data-input-group-slot="addon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
        <rect width="256" height="256" fill="none" />
        <circle
          cx="112"
          cy="112"
          r="80"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="16"
        />
        <line
          x1="168.57"
          y1="168.57"
          x2="224"
          y2="224"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="16"
        />
      </svg>
    </span>
    <span data-input-group-slot="addon" data-input-group-align="inline-end">
      <button
        data-ui="button"
        data-button-variant="ghost"
        data-button-size="icon-sm"
        type="submit"
        aria-label="Submit search"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
          <rect width="256" height="256" fill="none" />
          <line
            x1="40"
            y1="128"
            x2="216"
            y2="128"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="16"
          />
          <polyline
            points="144 56 216 128 144 200"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="16"
          />
        </svg>
      </button>
    </span>
  </label>
  <div data-field-slot="description">
    <span data-field-slot="hint" id="f-search-hint">Search across every page in the docs.</span>
  </div>
</div>

<div data-ui="field">
  <label data-field-slot="label" for="f-url">Website</label>
  <label data-ui="input-group">
    <input
      data-ui="input"
      id="f-url"
      type="url"
      name="url"
      inputmode="url"
      required
      placeholder="https://zazz.sh"
      autocomplete="url"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="go"
      aria-describedby="f-url-hint"
    />
    <span data-input-group-slot="addon">
      <span data-input-group-slot="text">https://</span>
    </span>
    <span data-input-group-slot="addon" data-input-group-align="inline-end">
      <button data-ui="button" data-button-variant="primary" data-button-size="sm" type="submit">
        Apply
      </button>
    </span>
  </label>
  <div data-field-slot="description">
    <span data-field-slot="hint" id="f-url-hint">Where people can find you online.</span>
    <span data-field-slot="error" role="alert">Enter a valid URL, e.g. https://zazz.sh.</span>
  </div>
</div>

<div data-ui="field">
  <label data-field-slot="label" for="f-prompt">Prompt</label>
  <label data-ui="input-group">
    <textarea
      id="f-prompt"
      data-ui="textarea"
      name="prompt"
      inputmode="text"
      placeholder="Ask anything…"
      aria-describedby="f-prompt-hint"
    ></textarea>
    <span data-input-group-slot="addon" data-input-group-align="block-end">
      <button
        data-ui="button"
        data-button-size="sm"
        type="submit"
        style="
          --bg: var(--color-background);
          --ml: auto;
        "
      >
        <span>Send</span> <kbd>↵</kbd>
      </button>
    </span>
  </label>
  <div data-field-slot="description">
    <span data-field-slot="hint" id="f-prompt-hint"
      >Enter to send · Shift + Enter for a new line.</span
    >
  </div>
</div>
