<fieldset data-ui="field-group">
  <legend>Notifications</legend>
  <div
    style="
      --display: flex;
      --flex-direction: column;
      --gap: var(--space-xs);
    "
  >
    <label data-ui="field" data-field-orientation="horizontal">
      <input type="checkbox" role="switch" name="notifications-email" />
      <span data-field-slot="label">Email notifications</span>
    </label>
    <label data-ui="field" data-field-orientation="horizontal">
      <input type="checkbox" role="switch" name="notifications-2fa" checked />
      <span data-field-slot="label">Two-factor authentication</span>
    </label>
  </div>
</fieldset>
