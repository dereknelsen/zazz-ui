<div
  aria-label="Application menu"
  style="
    --border-b-width: 1px;
    --border-b-color: var(--color-border);
    --display: flex;
    --w: 100%;
    --items: center;
    --gap: 1px;
    --bg: var(--color-card);
    --p: var(--space-xs);
  "
>
  <ui-menu>
    <button
      data-ui="button"
      data-button-variant="ghost"
      type="button"
      popovertarget="menubar-example-file"
      interestfor="menubar-example-file"
    >
      File
    </button>
    <div
      id="menubar-example-file"
      data-menu-slot="popover"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="auto"
    >
      <menu>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            New window
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Open...
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Save
          </button>
        </li>
        <hr data-ui="separator" style="--my: var(--space-xs)" />
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Close window
          </button>
        </li>
      </menu>
    </div>
  </ui-menu>

  <ui-menu>
    <button
      data-ui="button"
      data-button-variant="ghost"
      type="button"
      popovertarget="menubar-example-edit"
      interestfor="menubar-example-edit"
    >
      Edit
    </button>
    <div
      id="menubar-example-edit"
      data-menu-slot="popover"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="auto"
    >
      <menu>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Undo
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Redo
          </button>
        </li>
        <hr data-ui="separator" style="--my: var(--space-xs)" />
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Cut
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Copy
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Paste
          </button>
        </li>
      </menu>
    </div>
  </ui-menu>

  <ui-menu>
    <button
      data-ui="button"
      data-button-variant="ghost"
      type="button"
      popovertarget="menubar-example-view"
      interestfor="menubar-example-view"
    >
      View
    </button>
    <div
      id="menubar-example-view"
      data-menu-slot="popover"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="auto"
    >
      <menu>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Zoom in
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Zoom out
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="
              --w: 100%;
              --justify: space-between;
            "
          >
            Full screen
          </button>
        </li>
      </menu>
    </div>
  </ui-menu>

  <ui-menu>
    <button
      data-ui="button"
      data-button-variant="ghost"
      type="button"
      popovertarget="menubar-example-help"
      interestfor="menubar-example-help"
    >
      Help
    </button>
    <div
      id="menubar-example-help"
      data-menu-slot="popover"
      data-popover-side="bottom"
      data-popover-align="end"
      popover="auto"
    >
      <menu>
        <li>
          <a
            href="#"
            data-ui="button"
            data-button-variant="ghost"
            style="
              --w: 100%;
              --justify: space-between;
            "
            >Documentation</a
          >
        </li>
        <li>
          <a
            href="#"
            data-ui="button"
            data-button-variant="ghost"
            style="
              --w: 100%;
              --justify: space-between;
            "
            >Keyboard shortcuts</a
          >
        </li>
        <li>
          <a
            href="#"
            data-ui="button"
            data-button-variant="ghost"
            style="
              --w: 100%;
              --justify: space-between;
            "
            >Report an issue</a
          >
        </li>
      </menu>
    </div>
  </ui-menu>
</div>
