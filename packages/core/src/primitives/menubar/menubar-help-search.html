<div
  aria-label="Application menu"
  style="
    --border-b-width: 1px;
    --border-b-color: var(--color-border);
    --display: flex;
    --w: 100%;
    --items: center;
    --gap: 1px;
    --bg: var(--color-card);
    --p: var(--space-xs);
  "
>
  <ui-menu>
    <button
      data-ui="button"
      data-button-variant="ghost"
      type="button"
      popovertarget="menubar-search-file"
      interestfor="menubar-search-file"
    >
      File
    </button>
    <div
      id="menubar-search-file"
      data-menu-slot="popover"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="auto"
    >
      <menu>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="--justify: start"
          >
            New window
          </button>
        </li>
        <li>
          <button
            data-ui="button"
            data-button-variant="ghost"
            type="button"
            style="--justify: start"
          >
            Open…
          </button>
        </li>
      </menu>
    </div>
  </ui-menu>

  <ui-menu>
    <button
      data-ui="button"
      data-button-variant="ghost"
      type="button"
      popovertarget="menubar-search-help"
      interestfor="menubar-search-help"
    >
      Help
    </button>
    <div
      id="menubar-search-help"
      data-menu-slot="popover"
      data-popover-side="bottom"
      data-popover-align="start"
      popover="auto"
    >
      <div
        style="
          --display: flex;
          --flex-direction: column;
          --gap: var(--space-xs);
          --p: var(--space-xs);
          --min-w: 20rem;
        "
      >
        <label
          for="menubar-help-topic"
          style="
            --font-weight: var(--font-weight-strong);
            --display: inline-flex;
            --font-size: var(--font-size-eyebrow);
            --leading: var(--leading-eyebrow);
            --font-weight: var(--font-weight-eyebrow);
            --tracking: var(--tracking-eyebrow);
            --text-transform: uppercase;
            --text: var(--color-muted-foreground);
          "
          >Search help topics</label
        >
        <ui-combobox>
          <input type="hidden" name="help-topic" data-combobox-slot="value" value="" />
          <div data-combobox-slot="control">
            <input
              id="menubar-help-topic"
              type="text"
              placeholder="Find a topic…"
              role="combobox"
              aria-expanded="true"
              aria-autocomplete="list"
              autocomplete="off"
            />
          </div>
          <!-- No [popover] = the inline variant: the list renders in flow, always open -->
          <div data-combobox-slot="panel">
            <ul role="listbox" data-combobox-slot="list" aria-label="Help topics">
              <li
                role="option"
                data-combobox-slot="item"
                data-ui="button"
                data-button-variant="ghost"
                data-combobox-value="shortcuts"
                style="--justify: start"
              >
                Keyboard shortcuts
              </li>
              <li
                role="option"
                data-combobox-slot="item"
                data-ui="button"
                data-button-variant="ghost"
                data-combobox-value="theming"
                style="--justify: start"
              >
                Theming and dark mode
              </li>
              <li
                role="option"
                data-combobox-slot="item"
                data-ui="button"
                data-button-variant="ghost"
                data-combobox-value="updates"
                style="--justify: start"
              >
                Checking for updates
              </li>
            </ul>
            <p data-combobox-slot="empty" style="--text: var(--color-muted-foreground)">
              No topics found.
            </p>
          </div>
        </ui-combobox>
      </div>
    </div>
  </ui-menu>
</div>
