<div
  style="
    --display: flex-col;
    --gap: var(--space-md);
    --w: 100%;
    --max-w: 96;
  "
>
  <div
    style="
      --p: var(--space-sm);
      --bg: var(--color-muted);
      --rounded: var(--radius-lg);
    "
  >
    <div
      data-ui="text-sm"
      style="
        --p: var(--space-sm);
        --mx: auto;
        --w: var(--space-md);
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-md);
      "
    >
      --mx: auto
    </div>
  </div>
  <div
    style="
      --display: flex;
      --p: var(--space-sm);
      --gap: var(--space-sm);
      --bg: var(--color-muted);
      --rounded: var(--radius-lg);
    "
  >
    <span data-ui="badge" data-badge-variant="muted">start</span>
    <span data-ui="badge" data-badge-variant="primary" style="--ml: auto">--ml: auto</span>
  </div>
</div>
