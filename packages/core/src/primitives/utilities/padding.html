<div class="flex flex-wrap items-start gap-md">
  <div class="bg-muted rounded-md p-xs">
    <div
      class="grid place-items-center bg-primary text-primary-foreground rounded-sm p-sm text-xs font-strong aspect-square"
    >
      p-xs
    </div>
  </div>
  <div class="bg-muted rounded-md p-sm">
    <div
      class="grid place-items-center bg-primary text-primary-foreground rounded-sm p-sm text-xs font-strong aspect-square"
    >
      p-sm
    </div>
  </div>
  <div class="bg-muted rounded-md p-md">
    <div
      class="grid place-items-center bg-primary text-primary-foreground rounded-sm p-sm text-xs font-strong aspect-square"
    >
      p-md
    </div>
  </div>
  <div class="bg-muted rounded-md p-lg">
    <div
      class="grid place-items-center bg-primary text-primary-foreground rounded-sm p-sm text-xs font-strong aspect-square"
    >
      p-lg
    </div>
  </div>
  <!-- Open values: style prop (ADR-0012). --p: 5 is five spacing steps, between p-sm (4) and p-md (6) -->
  <div class="bg-muted rounded-md" style="--p: 5">
    <div
      class="grid place-items-center bg-tertiary text-tertiary-foreground rounded-sm p-sm text-xs font-strong aspect-square"
    >
      --p: 5
    </div>
  </div>
</div>
