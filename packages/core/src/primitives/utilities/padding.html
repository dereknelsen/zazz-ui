<div
  style="
    --display: flex;
    --flex-wrap: wrap;
    --items: start;
    --gap: var(--space-md);
  "
>
  <div
    style="
      --p: var(--space-xs);
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place: center;
        --p: var(--space-sm);
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: var(--space-xs)
    </div>
  </div>
  <div
    style="
      --p: var(--space-sm);
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place: center;
        --p: var(--space-sm);
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: var(--space-sm)
    </div>
  </div>
  <div
    style="
      --p: var(--space-md);
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place: center;
        --p: var(--space-sm);
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: var(--space-md)
    </div>
  </div>
  <div
    style="
      --p: var(--space-lg);
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place: center;
        --p: var(--space-sm);
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: var(--space-lg)
    </div>
  </div>
</div>
