<article
  style="
    --display: flex-col;
    --p: 11;
    --gap: 6;
    --w: 100%;
    --max-w: 96;
    --text: var(--color-card-foreground);
    --bg: var(--color-card);
    --border-color: var(--color-border);
    --border-width: 1px;
    --shadow: md;
    --rounded: var(--radius-lg);
  "
>
  <div
    style="
      --display: flex;
      --items: center;
      --justify: space-between;
      --gap: 4;
    "
  >
    <span data-ui="badge" data-badge-variant="primary">Utilities</span>
    <span data-ui="text-xs" style="--text: var(--color-muted-foreground)">12 groups</span>
  </div>
  <hgroup
    style="
      --display: flex-col;
      --gap: 2;
    "
  >
    <h3 data-ui="text-lg" style="--font-family: var(--font-family-heading)">Composed from atoms</h3>
    <p
      data-ui="text-sm"
      style="
        --text-wrap: pretty;
        --text: var(--color-muted-foreground);
      "
    >
      No component class here — just flex, gap, padding, radius, border, shadow, and color utilities
      reading the same semantic tokens.
    </p>
  </hgroup>
  <div
    style="
      --display: flex;
      --items: center;
      --pt: 4;
      --gap: 4;
      --border-t: 1;
    "
  >
    <button type="button" data-ui="button" data-button-variant="primary">Get started</button>
    <button type="button" data-ui="button" data-button-variant="ghost">Browse groups</button>
  </div>
</article>
