<div
  style="
    --display: grid;
    --grid-cols: 3;
    --gap: var(--space-md);
    --w: 100%;
    --max-w: 96;
  "
>
  <div
    data-ui="text-xs"
    style="
      --aspect: 1;
      --display: flex;
      --items: center;
      --justify: center;
      --bg: var(--color-primary);
      --text: var(--color-primary-foreground);
      --rounded: var(--radius-md);
      --p: var(--space-xs);
      --text-align: center;
      --font-weight: var(--font-weight-strong);
    "
  >
    --aspect: 1 · 1:1
  </div>
  <div
    data-ui="text-xs"
    style="
      --aspect: 16 / 9;
      --display: flex;
      --items: center;
      --justify: center;
      --bg: var(--color-secondary);
      --text: var(--color-secondary-foreground);
      --rounded: var(--radius-md);
      --p: var(--space-xs);
      --text-align: center;
      --font-weight: var(--font-weight-strong);
    "
  >
    --aspect: 16 / 9 · 16:9
  </div>
  <div
    data-ui="text-xs"
    style="
      --aspect: 2 / 3;
      --display: flex;
      --items: center;
      --justify: center;
      --bg: var(--color-tertiary);
      --text: var(--color-tertiary-foreground);
      --rounded: var(--radius-md);
      --p: var(--space-xs);
      --text-align: center;
      --font-weight: var(--font-weight-strong);
    "
  >
    --aspect: 2 / 3 · 2:3
  </div>
</div>
