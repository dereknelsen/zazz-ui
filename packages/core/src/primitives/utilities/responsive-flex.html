<div
  style="
    --display: flex;
    --flex-direction: column;
    --gap: var(--space-xs);
    --w: 100%;
  "
>
  <span
    data-ui="text-xs"
    style="
      --text: var(--color-muted-foreground);
      --font-weight: var(--font-weight-strong);
    "
  >
    --flex-direction: column; --flex-direction--sm: row — stacks on a narrow container, rows out on
    a wide one. Expand to see it.
  </span>
  <div
    style="
      --display: flex;
      --flex-direction: column;
      --flex-direction--sm: row;
      --gap: var(--space-md);
      --w: 100%;
    "
  >
    <div
      data-ui="text-sm"
      style="
        --flex: 1;
        --bg: var(--color-primary);
        --text: var(--color-primary-foreground);
        --rounded: var(--radius-md);
        --p: var(--space-md);
        --text-align: center;
        --font-weight: var(--font-weight-strong);
      "
    >
      Sidebar
    </div>
    <div
      data-ui="text-sm"
      style="
        --flex: 1;
        --bg: var(--color-muted);
        --text: var(--color-muted-foreground);
        --rounded: var(--radius-md);
        --p: var(--space-md);
        --text-align: center;
        --font-weight: var(--font-weight-strong);
      "
    >
      Content
    </div>
    <div
      data-ui="text-sm"
      style="
        --flex: 1;
        --bg: var(--color-muted);
        --text: var(--color-muted-foreground);
        --rounded: var(--radius-md);
        --p: var(--space-md);
        --text-align: center;
        --font-weight: var(--font-weight-strong);
      "
    >
      Aside
    </div>
  </div>
</div>
