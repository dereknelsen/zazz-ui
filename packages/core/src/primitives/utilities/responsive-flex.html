<div
  style="
    --display: flex-col;
    --gap: var(--space-xs);
    --w: 100%;
  "
>
  <span
    data-ui="text-xs"
    style="
      --font-weight: strong;
      --text: var(--color-muted-foreground);
    "
  >
    --display: flex-col; --display--sm: flex-row — stacks on a narrow container, rows out on a wide
    one. Expand to see it.
  </span>
  <div
    style="
      --display: flex-col;
      --display--sm: flex-row;
      --gap: var(--space-md);
      --w: 100%;
    "
  >
    <div
      data-ui="text-sm"
      style="
        --flex: 1;
        --p: var(--space-md);
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-md);
      "
    >
      Sidebar
    </div>
    <div
      data-ui="text-sm"
      style="
        --flex: 1;
        --p: var(--space-md);
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-muted-foreground);
        --bg: var(--color-muted);
        --rounded: var(--radius-md);
      "
    >
      Content
    </div>
    <div
      data-ui="text-sm"
      style="
        --flex: 1;
        --p: var(--space-md);
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-muted-foreground);
        --bg: var(--color-muted);
        --rounded: var(--radius-md);
      "
    >
      Aside
    </div>
  </div>
</div>
