<div
  style="
    --display: grid;
    --grid-cols: 3;
    --gap: 6;
    --w: 100%;
    --max-w: 96;
  "
>
  <figure
    style="
      --display: flex-col;
      --gap: 2;
    "
  >
    <img
      src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=320&h=200&q=60"
      width="320"
      height="200"
      loading="lazy"
      alt="Savanna grass at dawn"
      style="
        --w: 100%;
        --aspect: 1;
        --bg: var(--color-muted);
        --rounded: var(--radius-md);
        --object-fit: cover;
      "
    />
    <figcaption
      data-ui="text-xs"
      style="
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-muted-foreground);
      "
    >
      --object-fit: cover
    </figcaption>
  </figure>
  <figure
    style="
      --display: flex-col;
      --gap: 2;
    "
  >
    <img
      src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=320&h=200&q=60"
      width="320"
      height="200"
      loading="lazy"
      alt="Savanna grass at dawn"
      style="
        --w: 100%;
        --aspect: 1;
        --bg: var(--color-muted);
        --rounded: var(--radius-md);
        --object-fit: contain;
      "
    />
    <figcaption
      data-ui="text-xs"
      style="
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-muted-foreground);
      "
    >
      --object-fit: contain
    </figcaption>
  </figure>
  <figure
    style="
      --display: flex-col;
      --gap: 2;
    "
  >
    <img
      src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=320&h=200&q=60"
      width="320"
      height="200"
      loading="lazy"
      alt="Savanna grass at dawn"
      style="
        --w: 100%;
        --aspect: 1;
        --bg: var(--color-muted);
        --rounded: var(--radius-md);
        --object-fit: fill;
      "
    />
    <figcaption
      data-ui="text-xs"
      style="
        --font-weight: strong;
        --text-align: center;
        --text: var(--color-muted-foreground);
      "
    >
      --object-fit: fill
    </figcaption>
  </figure>
</div>
