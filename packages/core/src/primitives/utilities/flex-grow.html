<div
  style="
    --display: flex;
    --gap: var(--space-sm);
    --w: 100%;
    --max-w: 96;
  "
>
  <div
    data-ui="text-sm"
    style="
      --flex: none;
      --bg: var(--color-muted);
      --text: var(--color-muted-foreground);
      --rounded: var(--radius-md);
      --p: var(--space-sm);
      --text-align: center;
      --font-weight: var(--font-weight-strong);
    "
  >
    --flex: none
  </div>
  <div
    data-ui="text-sm"
    style="
      --flex: 1;
      --bg: var(--color-primary);
      --text: var(--color-primary-foreground);
      --rounded: var(--radius-md);
      --p: var(--space-sm);
      --text-align: center;
      --font-weight: var(--font-weight-strong);
    "
  >
    --flex: 1
  </div>
  <div
    data-ui="text-sm"
    style="
      --flex: 1;
      --bg: var(--color-primary);
      --text: var(--color-primary-foreground);
      --rounded: var(--radius-md);
      --p: var(--space-sm);
      --text-align: center;
      --font-weight: var(--font-weight-strong);
    "
  >
    --flex: 1
  </div>
</div>
