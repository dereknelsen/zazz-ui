<div
  style="
    --display: flex;
    --flex-wrap: wrap;
    --items: start;
    --gap: 6;
  "
>
  <div
    style="
      --p: 6;
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place-items: center;
        --p: 4;
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: 6
    </div>
  </div>
  <div
    style="
      --p: 6;
      --pl: 0;
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place-items: center;
        --p: 4;
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: 6; --pl: 0
    </div>
  </div>
  <div
    style="
      --p: 6;
      --py: 2;
      --bg: var(--color-muted);
      --rounded: var(--radius-md);
    "
  >
    <div
      data-ui="text-xs"
      style="
        --display: grid;
        --place-items: center;
        --p: 4;
        --aspect: 1;
        --font-weight: strong;
        --text: var(--color-primary-foreground);
        --bg: var(--color-primary);
        --rounded: var(--radius-sm);
      "
    >
      --p: 6; --py: 2
    </div>
  </div>
</div>
