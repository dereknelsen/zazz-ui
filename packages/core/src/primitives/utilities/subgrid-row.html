<div
  style="
    --display: grid;
    --grid-cols: 3;
    --gap-x: 4;
    --gap-y: 2;
    --w: 100%;
    --max-w: 160;
  "
>
  <article
    style="
      --display: subgrid-row;
      --row-span: 3;
      --p: 4;
      --bg: var(--color-muted);
      --radius: 2.5;
    "
  >
    <strong data-ui="text-sm"> Warbler </strong>
    <p
      data-ui="text-sm"
      style="
        --m: 0;
        --text: var(--color-muted-foreground);
      "
    >
      Seen once, at dawn.
    </p>
    <span
      data-ui="text-xs"
      style="
        --font-weight: strong;
        --text: var(--color-primary);
      "
    >
      Rare
    </span>
  </article>
  <article
    style="
      --display: subgrid-row;
      --row-span: 3;
      --p: 4;
      --bg: var(--color-muted);
      --radius: 2.5;
    "
  >
    <strong data-ui="text-sm"> Great blue heron on the east pond </strong>
    <p
      data-ui="text-sm"
      style="
        --m: 0;
        --text: var(--color-muted-foreground);
      "
    >
      A resident pair nests in the dead oak every spring and fishes the shallows through October.
    </p>
    <span
      data-ui="text-xs"
      style="
        --font-weight: strong;
        --text: var(--color-primary);
      "
    >
      Common
    </span>
  </article>
  <article
    style="
      --display: subgrid-row;
      --row-span: 3;
      --p: 4;
      --bg: var(--color-muted);
      --radius: 2.5;
    "
  >
    <strong data-ui="text-sm"> Kestrel </strong>
    <p
      data-ui="text-sm"
      style="
        --m: 0;
        --text: var(--color-muted-foreground);
      "
    >
      Hovers over the meadow most afternoons.
    </p>
    <span
      data-ui="text-xs"
      style="
        --font-weight: strong;
        --text: var(--color-primary);
      "
    >
      Seasonal
    </span>
  </article>
</div>
