<div
  style="
    --display: flex;
    --flex-wrap: wrap;
    --gap: var(--space-md);
    --w: 100%;
    --max-w: 96;
  "
>
  <div
    data-ui="text-sm"
    style="
      --basis: calc((100% - var(--space-md)) / 2);
      --p: var(--space-sm);
      --font-weight: strong;
      --text-align: center;
      --text: var(--color-primary-foreground);
      --bg: var(--color-primary);
      --rounded: var(--radius-md);
    "
  >
    --basis: 1/2
  </div>

  <div
    data-ui="text-sm"

      --text: var(--color-secondary-foreground);

      --rounded: var(--radius-md);
    "
