<div
  style="
    --position: relative;
    --p: var(--space-md);
    --w: 100%;
    --h: var(--space-md);
    --max-w: 96;
    --bg: var(--color-muted);
    --rounded: var(--radius-lg);
  "
>
  <span
    data-ui="badge"
    data-badge-variant="primary"
    style="
      --position: absolute;
      --top: var(--space-sm);
      --left: var(--space-sm);
    "
    >--top: var(--space-sm); --left: var(--space-sm)</span
  >
  <span
    data-ui="badge"
    data-badge-variant="muted"
    style="
      --position: absolute;
      --top: var(--space-sm);
      --right: var(--space-sm);
    "
    >--top: var(--space-sm); --right: var(--space-sm)</span
  >
  <span
    data-ui="badge"
    data-badge-variant="muted"
    style="
      --position: absolute;
      --bottom: var(--space-sm);
      --left: var(--space-sm);
    "
    >--bottom: var(--space-sm); --left: var(--space-sm)</span
  >
  <span
    data-ui="badge"
    data-badge-variant="primary"
    style="
      --position: absolute;
      --bottom: var(--space-sm);
      --right: var(--space-sm);
    "
    >--bottom: var(--space-sm); --right: var(--space-sm)</span
  >
  <div
    data-ui="text-xs"
    style="
      --display: flex;
      --position: absolute;
      --items: center;
      --justify: center;
      --inset: var(--space-md);
      --font-weight: strong;
      --text: var(--color-muted-foreground);
      --border-color: var(--color-border);
      --border-width: 1px;
      --border-style: dashed;
      --rounded: var(--radius-md);
    "
  >
    --position: absolute; --inset: var(--space-md)
  </div>
</div>
