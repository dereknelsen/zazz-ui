<div
  style="
    --position: relative;
    --p: 6;
    --w: 100%;
    --h: 40;
    --max-w: 96;
    --bg: var(--color-muted);
    --radius: 4.5;
  "
>
  <span
    data-ui="badge"
    data-badge-variant="primary"
    style="
      --position: absolute;
      --top: 4;
      --left: 4;
    "
    >--top: 4; --left: 4</span
  >
  <span
    data-ui="badge"
    data-badge-variant="muted"
    style="
      --position: absolute;
      --top: 4;
      --right: 4;
    "
    >--top: 4; --right: 4</span
  >
  <span
    data-ui="badge"
    data-badge-variant="muted"
    style="
      --position: absolute;
      --bottom: 4;
      --left: 4;
    "
    >--bottom: 4; --left: 4</span
  >
  <span
    data-ui="badge"
    data-badge-variant="primary"
    style="
      --position: absolute;
      --bottom: 4;
      --right: 4;
    "
    >--bottom: 4; --right: 4</span
  >
  <div
    data-ui="text-xs"
    style="
      --display: flex;
      --position: absolute;
      --items: center;
      --justify: center;
      --inset: 6;
      --font-weight: strong;
      --text: var(--color-muted-foreground);
      --border-color: var(--color-border);
      --border-width: 1px;
      --border-style: dashed;
      --radius: 2.5;
    "
  >
    --position: absolute; --inset: 6
  </div>
</div>
