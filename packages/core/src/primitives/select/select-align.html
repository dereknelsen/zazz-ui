<div
  style="
    --display: flex;
    --items: start;
    --gap: 4;
  "
>
  <div data-ui="field">
    <label data-field-slot="label" for="f-align-start">Start</label>
    <select data-ui="select" id="f-align-start" name="align-start" data-select-align="start">
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <optgroup
        label="Sort by"
        style="
          --display: grid;
          --gap: 1px;
        "
      >
        <legend
          style="
            --display: inline-flex;
            --p: 2;
            --font-size: var(--font-size-eyebrow);
            --font-weight: var(--font-weight-eyebrow);
            --leading: var(--leading-eyebrow);
            --tracking: var(--tracking-eyebrow);
            --text-transform: uppercase;
            --text: var(--color-muted-foreground);
          "
        >
          Sort by
        </legend>
        <option value="recent" selected>Most recent</option>
        <option value="popular">Most popular</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </optgroup>
    </select>
  </div>

  <div data-ui="field">

  </div>
