<div
  style="
    --display: grid;
    --place: center;
    --grid-cols: 2;
    --gap: var(--space-sm);
  "
>
  <div data-ui="field">
    <label data-field-slot="label" for="f-side-top">Top</label>
    <select data-ui="select" id="f-side-top" name="side-top" data-select-side="top">
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <optgroup
        label="Sort by"
        style="
          --display: grid;
          --gap: 1px;
        "
      >
        <legend
          style="
            --display: inline-flex;
            --p: var(--space-xs);
            --font-size: var(--font-size-eyebrow);
            --font-weight: var(--font-weight-eyebrow);
            --leading: var(--leading-eyebrow);
            --tracking: var(--tracking-eyebrow);
            --text-transform: uppercase;
            --text: var(--color-muted-foreground);
          "
        >
          Sort by
        </legend>
        <option value="recent" selected>Most recent</option>
        <option value="popular">Most popular</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </optgroup>
    </select>
  </div>
