<button data-ui="button" type="button" command="show-modal" commandfor="dialog-example-1">
  Dialog
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <rect width="256" height="256" fill="none" />
    <line
      x1="64"
      y1="192"
      x2="192"
      y2="64"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="16"
    />
    <polyline
      points="88 64 192 64 192 168"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="16"
    />
  </svg>
</button>
<dialog id="dialog-example-1" data-ui="dialog" closedby="any">
  <div data-dialog-slot="content">
    <header data-dialog-slot="header">
      <h2
        style="
          --font-size: var(--font-size-lg);
          --font-weight: strong;
          --font-family: var(--font-family-heading);
        "
      >
        Dialog title
      </h2>
      <p style="--text: var(--color-muted-foreground)">
        This dialog was opened using an
        <a
          href="https://developer.mozilla.org/en-US/docs/Web/API/Invoker_Commands_API"
          target="_blank"
          style="--text: var(--color-primary)"
          >invoker command</a
        >.
      </p>
    </header>
    <div data-dialog-slot="body">
      <p>Set the size of the dialog with the <code>data-dialog-size</code> attribute.</p>
    </div>
    <footer data-dialog-slot="footer">
      <button data-ui="button" type="button" commandfor="dialog-example-1" command="close">
        Cancel
      </button>
      <button
        data-ui="button"
        data-button-variant="primary"
        commandfor="dialog-example-1"
        command="close"
      >
        Accept
      </button>
    </footer>
  </div>
  <button
    data-ui="button"
    data-dialog-slot="close"
    data-button-size="icon"
    data-button-variant="ghost"
    type="button"
    commandfor="dialog-example-1"
    command="close"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
      <rect width="256" height="256" fill="none" />
      <line
        x1="200"
        y1="56"
        x2="56"
        y2="200"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="16"
      />
      <line
        x1="200"
        y1="200"
        x2="56"
        y2="56"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="16"
      />
    </svg>
  </button>
</dialog>
