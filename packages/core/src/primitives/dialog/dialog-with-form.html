<button data-ui="button" type="button" command="show-modal" commandfor="form-dialog-1">
  New project
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <rect width="256" height="256" fill="none" />
    <line
      x1="40"
      y1="128"
      x2="216"
      y2="128"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="16"
    />
    <line
      x1="128"
      y1="40"
      x2="128"
      y2="216"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="16"
    />
  </svg>
</button>
<dialog id="form-dialog-1" data-ui="dialog" closedby="any" data-dialog-size="article">
  <div data-dialog-slot="content">
    <header data-dialog-slot="header">
      <h2
        style="
          --font-size: var(--font-size-lg);
          --font-weight: strong;
          --font-family: var(--font-family-heading);
        "
      >
        New project
      </h2>
      <p style="--text: var(--color-muted-foreground)">
        Add a project to your workspace. You can change these settings later.
      </p>
    </header>
    <form
      id="f-new-project-1"
      style="
        --display: flex-col;
        --gap: var(--space-md);
      "
      data-dialog-slot="body"
      method="dialog"
    >
      <fieldset data-ui="field-group">
        <legend data-ui="sr-only">Contact</legend>
        <div
          style="
            --display: grid;
            --grid-cols: 2;
            --gap: var(--space-sm);
          "
        >
          <div data-ui="field">
            <label data-field-slot="label" for="fd-name">Name</label>
            <input
              data-ui="input"
              id="fd-name"
              name="name"
              type="text"
              inputmode="text"
              placeholder="Ada Lovelace"
              required
            />
          </div>
          <div data-ui="field">
            <label data-field-slot="label" for="fd-email">Email</label>
            <input
              data-ui="input"
              id="fd-email"
              name="email"
              type="email"
              inputmode="email"
              required
              placeholder="you@example.com"
              autocomplete="email"
              aria-describedby="fd-email-hint"
            />
            <div data-field-slot="description">
              <span data-field-slot="hint" id="fd-email-hint"
                >We'll only use this to send receipts.</span
              >
              <span data-field-slot="error" role="alert">Please enter a valid email address.</span>
            </div>
          </div>
          <label data-ui="field" style="--col-span: 2">
            <span data-field-slot="label">Repository</span>
            <div data-ui="input-group">
              <input
                data-ui="input"
                type="search"
                name="repo"
                id="fd-repo"
                inputmode="search"
                placeholder="Search repositories…"
              />
              <span data-input-group-slot="addon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                  <rect width="256" height="256" fill="none" />
                  <circle
                    cx="112"
                    cy="112"
                    r="80"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  />
                  <line
                    x1="168.57"
                    y1="168.57"
                    x2="224"
                    y2="224"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="16"
                  />
                </svg>
              </span>
            </div>
          </label>
        </div>
      </fieldset>

      <fieldset data-ui="field-group">
        <div data-ui="field">
          <label data-field-slot="label" for="fd-message">Description</label>
          <textarea
            data-ui="textarea"
            id="fd-message"
            name="description"
            inputmode="text"
            placeholder="What is this project for?"
          ></textarea>
        </div>
      </fieldset>

      <fieldset data-ui="radio-group">
        <legend>Billing</legend>
        <label data-ui="field" data-field-orientation="horizontal">
          <input data-ui="radio" type="radio" name="billing" value="monthly" />
          <span data-field-slot="label">Monthly billing</span>
        </label>
        <label data-ui="field" data-field-orientation="horizontal">
          <input data-ui="radio" type="radio" name="billing" value="annual" checked />
          <span data-field-slot="label">Annual billing</span>
        </label>
      </fieldset>

      <label data-ui="field" data-field-orientation="horizontal">
        <input type="checkbox" name="terms" required />
        <span data-field-slot="label">Accept terms &amp; conditions</span>
      </label>
    </form>
    <footer data-dialog-slot="footer">
      <button
        data-ui="button"
        type="button"
        value="cancel"
        commandfor="form-dialog-1"
        command="close"
      >
        Cancel
      </button>
      <button
        data-ui="button"
        data-button-variant="primary"
        type="submit"
        form="f-new-project-1"
        value="save"
      >
        Create project
      </button>
    </footer>
    <button
      data-ui="button"
      data-dialog-slot="close"
      data-button-size="icon"
      data-button-variant="ghost"
      type="button"
      commandfor="form-dialog-1"
      command="close"
      aria-label="Close dialog"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
        <rect width="256" height="256" fill="none" />
        <line
          x1="200"
          y1="56"
          x2="56"
          y2="200"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="16"
        />
        <line
          x1="200"
          y1="200"
          x2="56"
          y2="56"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="16"
        />
      </svg>
    </button>
  </div>
</dialog>
