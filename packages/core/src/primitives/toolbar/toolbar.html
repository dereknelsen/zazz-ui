<div
  aria-label="Formatting options"
  style="
    --display: flex;
    --flex-wrap: wrap;
    --items: center;
    --p: 2;
    --gap: 2;
    --border-color: var(--color-border);
    --border-width: 1px;
    --rounded: var(--radius-lg);
  "
>
  <ui-button-group role="group" aria-label="History">
    <button data-ui="button" data-button-variant="outline" type="button">Undo</button>
    <button data-ui="button" data-button-variant="outline" type="button">Redo</button>
  </ui-button-group>

  <hr
    data-ui="separator"
    data-separator-orientation="vertical"
    aria-orientation="vertical"
    style="--mx: 2"
  />

  <ui-toggle-group role="group" aria-label="Text formatting">
    <label data-ui="toggle" data-toggle-size="icon">
      <input type="checkbox" name="format" value="bold" aria-label="Bold" checked />
      <span aria-hidden="true" style="--font-weight: strong">B</span>
    </label>
    <label data-ui="toggle" data-toggle-size="icon">
      <input type="checkbox" name="format" value="italic" aria-label="Italic" />
      <span aria-hidden="true" style="--font-style: italic">I</span>
    </label>
    <label data-ui="toggle" data-toggle-size="icon">
      <input type="checkbox" name="format" value="underline" aria-label="Underline" />
      <u aria-hidden="true">U</u>
    </label>
  </ui-toggle-group>

  <hr
    data-ui="separator"
    data-separator-orientation="vertical"
    aria-orientation="vertical"
    style="--mx: 2"
  />

  <select data-ui="select" aria-label="Paragraph style" style="--w: auto">
    <button>
      <selectedcontent></selectedcontent>
    </button>
    <option value="paragraph" selected>Paragraph</option>
    <option value="heading">Heading</option>
    <option value="quote">Quote</option>
  </select>

  <input
    data-ui="input"
    type="search"
    aria-label="Find in document"
    placeholder="Find"
    style="
      --ml: auto;
      --max-w: 16ch;
    "
  />
</div>
