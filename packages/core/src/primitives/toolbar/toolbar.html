<div
  class="flex flex-row flex-wrap items-center gap-xs rounded-lg p-xs border"
  aria-label="Formatting options"
>
  <ui-button-group role="group" aria-label="History">
    <button class="ui-button" data-variant="outline" type="button">Undo</button>
    <button class="ui-button" data-variant="outline" type="button">Redo</button>
  </ui-button-group>

  <hr class="ui-separator mx-xs" data-orientation="vertical" aria-orientation="vertical" />

  <ui-toggle-group role="group" aria-label="Text formatting">
    <label class="ui-toggle" data-size="icon">
      <input type="checkbox" name="format" value="bold" aria-label="Bold" checked />
      <span class="font-strong" aria-hidden="true">B</span>
    </label>
    <label class="ui-toggle" data-size="icon">
      <input type="checkbox" name="format" value="italic" aria-label="Italic" />
      <span class="italic" aria-hidden="true">I</span>
    </label>
    <label class="ui-toggle" data-size="icon">
      <input type="checkbox" name="format" value="underline" aria-label="Underline" />
      <u aria-hidden="true">U</u>
    </label>
  </ui-toggle-group>

  <hr class="ui-separator mx-xs" data-orientation="vertical" aria-orientation="vertical" />

  <select class="ui-select" aria-label="Paragraph style" style="--ui-select-inline-size: auto">
    <button>
      <selectedcontent></selectedcontent>
    </button>
    <option value="paragraph" selected>Paragraph</option>
    <option value="heading">Heading</option>
    <option value="quote">Quote</option>
  </select>

  <input
    class="ui-input ml-auto"
    type="search"
    aria-label="Find in document"
    placeholder="Find"
    style="max-inline-size: 16ch"
  />
</div>
