<!-- command-actions.js shows how to register custom actions: listen for your
     `--command` on its `commandfor` target, or for `zazz:command-select` on
     the root. -->
<ui-command
  data-command-hotkey="mod+j"
  id="command-actions-target"
  style="
    --w: 100%;
    --max-w: 96;
  "
>
  <button
    data-ui="button"
    type="button"
    data-button-variant="outline"
    popovertarget="command-example-actions-1"
    data-command-slot="open"
    style="
      --justify: space-between;
      --w: 100%;
    "
  >
    <span style="--text: var(--color-muted-foreground)">Quick actions...</span>
    <ui-kbd-group><kbd>⌘</kbd><kbd>J</kbd></ui-kbd-group>
  </button>
  <div
    id="command-example-actions-1"
    data-command-slot="panel"
    data-popover-side="bottom"
    data-popover-align="start"
    popover="auto"
  >
    <header data-command-slot="header">
      <input
        data-command-slot="input"
        type="text"
        placeholder="Type a command..."
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        autocomplete="off"
        aria-label="Search commands"
      />
    </header>
    <div role="listbox" data-command-slot="list" aria-label="Commands">
      <button
        role="option"
        data-command-slot="item"
        data-ui="button"
        data-button-variant="ghost"
        type="button"
        command="--theme-toggle"
        commandfor="command-actions-target"
        tabindex="-1"
        data-command-keywords="dark light mode appearance"
        data-command-stay-open
        style="--justify: start"
      >
        Toggle theme
      </button>
      <button
        role="option"
        data-command-slot="item"
        data-ui="button"
        data-button-variant="ghost"
        type="button"
        command="--copy-link"
        commandfor="command-actions-target"
        tabindex="-1"
        data-command-keywords="share url clipboard"
        style="--justify: start"
      >
        Copy link
      </button>
      <button
        role="option"
        data-command-slot="item"
        data-ui="button"
        data-button-variant="ghost"
        type="button"
        command="--toast-success"
        commandfor="command-actions-toaster"
        data-title="Saved"
        data-description="Your changes are safe."
        tabindex="-1"
        data-command-keywords="notify notification"
        style="--justify: start"
      >
        Show a toast
      </button>
    </div>
    <p data-command-slot="empty" style="--text: var(--color-muted-foreground)">
      No commands found.
    </p>
    <footer data-command-slot="footer">
      <span
        ><ui-kbd-group><kbd>↑</kbd><kbd>↓</kbd></ui-kbd-group> navigate</span
      >
      <span><kbd>↵</kbd> select</span>
    </footer>
  </div>
</ui-command>

<ui-toaster id="command-actions-toaster" data-toaster-position="bottom-end"></ui-toaster>
