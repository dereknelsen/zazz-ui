<ui-command
  data-command-hotkey="mod+shift+k"
  style="
    --w: 100%;
    --max-w: 96;
  "
>
  <button
    data-ui="button"
    type="button"
    data-button-variant="outline"
    command="show-modal"
    commandfor="command-example-dialog-1"
    data-command-slot="open"
    style="
      --w: 100%;
      --justify: space-between;
    "
  >
    <span style="--text: var(--color-muted-foreground)">Command palette...</span>
    <ui-kbd-group><kbd>⌘</kbd><kbd>⇧</kbd><kbd>K</kbd></ui-kbd-group>
  </button>
  <dialog id="command-example-dialog-1" data-ui="dialog" data-command-slot="panel" closedby="any">
    <header data-command-slot="header">
      <input
        data-command-slot="input"
        type="text"
        placeholder="Type a command or search..."
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        autocomplete="off"
        aria-label="Search commands"
      />
    </header>
    <div role="listbox" data-command-slot="list" aria-label="Commands">
      <div role="group" data-command-slot="group" aria-labelledby="command-example-dialog-1-nav">
        <span
          data-command-slot="group-label"
          id="command-example-dialog-1-nav"
          style="
            --font-weight: var(--font-weight-strong);
            --display: inline-flex;
            --font-size: var(--font-size-eyebrow);
            --leading: var(--leading-eyebrow);
            --font-weight: var(--font-weight-eyebrow);
            --tracking: var(--tracking-eyebrow);
            --text-transform: uppercase;
            --text: var(--color-muted-foreground);
          "
          >Navigation</span
        >
        <a
          role="option"
          data-command-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          href="#home"
          tabindex="-1"
          style="--justify: start"
        >
          Go home
        </a>
        <a
          role="option"
          data-command-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          href="#projects"
          tabindex="-1"
          data-command-keywords="work portfolio"
          style="--justify: start"
        >
          Go to projects
        </a>
        <a
          role="option"
          data-command-slot="item"
          data-ui="button"
          data-button-variant="ghost"
          href="#team"
          tabindex="-1"
          data-command-keywords="people members"
          style="--justify: start"
        >
          Go to team
        </a>
      </div>
    </div>
    <p data-command-slot="empty" style="--text: var(--color-muted-foreground)">
      No commands found.
    </p>
    <footer data-command-slot="footer">
      <span
        ><ui-kbd-group><kbd>↑</kbd><kbd>↓</kbd></ui-kbd-group> navigate</span
      >
      <span><kbd>↵</kbd> select</span>
      <span><kbd>esc</kbd> close</span>
    </footer>
  </dialog>
</ui-command>
