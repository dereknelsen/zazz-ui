<ui-group
  style="
    --display: block;
    --p: 4;
    --border: 1;
    --radius: 2;
  "
>
  <p
    style="
      --font-weight: strong;
      --text: var(--color-foreground);
      --group-text--hover: var(--color-primary);
    "
  >
    Hover anywhere on this card
  </p>
  <p
    style="
      --opacity: 0.7;
      --group-opacity--hover: 1;
    "
  >
    The text follows the group's state, not its own.
  </p>
</ui-group>
